services:
  postgres:
    image: postgres:16-alpine
    container_name: fms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: fms-api

    restart: unless-stopped

    environment:
      NODE_ENV: production

      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FILE_STORAGE_ROOT: /var/lib/vaultfs
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET}
      FILE_PUBLIC_BASE_URL: ${FILE_PUBLIC_BASE_URL:-}
      FILE_SIGNED_URL_MAX_TTL_SECONDS: ${FILE_SIGNED_URL_MAX_TTL_SECONDS:-300}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-10485760}
      FILE_MAX_COUNT: ${FILE_MAX_COUNT:-5}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-nitp.ac.in}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AISENSY_API_KEY: ${AISENSY_API_KEY}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
    ports:
      - "${API_PORT}:4000"

    volumes:
      - vaultfs_storage:/var/lib/vaultfs

    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: fms-web

    restart: unless-stopped

    environment:
      NODE_ENV: production
      # Specify API URL for the client/server
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_URL: http://api:4000/api
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-${PORT_WEB:-3000}}}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-10485760}
      FILE_MAX_COUNT: ${FILE_MAX_COUNT:-5}
      FILE_SIGNED_URL_MAX_TTL_SECONDS: ${FILE_SIGNED_URL_MAX_TTL_SECONDS:-300}

    ports:
      - "${WEB_PORT:-${PORT_WEB:-3000}}:3000"

    depends_on:
      - api
    
volumes:
  postgres_data:
  vaultfs_storage:
